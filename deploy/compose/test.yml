name: xray-test

# The test stack intentionally exposes only loopback ports. It contains no
# application container: pytest runs on the host and connects to these two
# isolated services using backend/.env.example.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: xray_test
      POSTGRES_USER: xray_test
      POSTGRES_PASSWORD: xray_test_only_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - xray-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray_test -d xray_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - xray-test-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  xray-test-postgres:
    name: xray-test-postgres
  xray-test-redis:
    name: xray-test-redis
