name: xray-production

x-backend: &backend
  image: ${XRAY_BACKEND_IMAGE:?set XRAY_BACKEND_IMAGE to an immutable digest}
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  environment: &backend_environment
    XRAY_ENV: production
    XRAY_DATABASE_HOST: postgres
    XRAY_DATABASE_PORT: "5432"
    XRAY_DATABASE_NAME: ${XRAY_DATABASE_NAME:-xray}
    XRAY_REDIS_URL: redis://redis:6379/0
    XRAY_ALLOWED_HOSTS: ${XRAY_ADMIN_HOST}
    XRAY_PUBLIC_SUBSCRIPTION_BASE_URL: https://${XRAY_SUBSCRIPTION_HOST}
    XRAY_CSRF_TRUSTED_ORIGINS: https://${XRAY_ADMIN_HOST},https://${XRAY_ADMIN_HOST}:8443
    XRAY_SESSION_COOKIE_SECURE: "true"
    XRAY_CSRF_COOKIE_SECURE: "true"

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    read_only: true
    user: "70:70"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${XRAY_DATABASE_NAME:-xray}
      POSTGRES_USER: xray_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_db_password
    secrets: [owner_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,nosuid,size=8m
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xray_owner -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  database-bootstrap:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    profiles: [release]
    read_only: true
    user: "70:70"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      XRAY_DATABASE_HOST: postgres
      XRAY_DATABASE_PORT: "5432"
      XRAY_DATABASE_NAME: ${XRAY_DATABASE_NAME:-xray}
    secrets: [owner_db_password, admin_db_password, subscription_db_password, worker_db_password, outbox_db_password]
    volumes:
      - ../postgres/roles.sql:/opt/xray/roles.sql:ro
      - ../scripts/bootstrap-roles.sh:/opt/xray/bootstrap-roles.sh:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    entrypoint: [/opt/xray/bootstrap-roles.sh]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    read_only: true
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: ["/data:rw,noexec,nosuid,size=64m"]
    networks: [queue]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-api:
    <<: *backend
    command: [gunicorn, --chdir, /app/backend, --bind, "0.0.0.0:8000", --workers, "3", --access-logfile, "-", config.wsgi:application]
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_admin_api
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/admin_db_password
      XRAY_UPGRADE_ROOT: /var/lib/xray/upgrade
    secrets: [django_secret_key, control_master_key, subscription_master_key, admin_db_password]
    volumes:
      # Catalog/results are host-owned; keep history/releases root-only (0700).
      - type: bind
        source: /var/lib/xray/upgrade
        target: /var/lib/xray/upgrade
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/lib/xray/upgrade/requests
        target: /var/lib/xray/upgrade/requests
        bind: {create_host_path: false}
    networks: [control, data, queue, egress]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --output /dev/null --write-out '%{http_code}'
          --header 'Host: ${XRAY_ADMIN_HOST}' --header 'X-Forwarded-Proto: https'
          http://127.0.0.1:8000/health/live | grep -qx 200
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  migrator:
    <<: *backend
    profiles: [release]
    command: [python, /app/backend/manage.py, migrate, --check, --noinput]
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_owner
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/owner_db_password
    secrets: [django_secret_key, control_master_key, subscription_master_key, owner_db_password]
    networks: [data, queue]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  subscription-api:
    <<: *backend
    command: [gunicorn, --chdir, /app/backend, --bind, "0.0.0.0:8000", --workers, "2", --access-logfile, "-", --access-logformat, "%(m)s %(s)s %(b)s", config.wsgi:application]
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.subscription
      XRAY_ALLOWED_HOSTS: ${XRAY_SUBSCRIPTION_HOST}
      XRAY_CSRF_TRUSTED_ORIGINS: ""
      XRAY_DATABASE_USER: xray_subscription_reader
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/subscription_db_password
    secrets:
      - source: subscription_django_secret_key
        target: django_secret_key
      - subscription_master_key
      - subscription_db_password
    networks: [public-app, data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --output /dev/null --write-out '%{http_code}'
          --header 'Host: ${XRAY_SUBSCRIPTION_HOST}' --header 'X-Forwarded-Proto: https'
          http://127.0.0.1:8000/health/live | grep -qx 200
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    <<: *backend
    working_dir: /app/backend
    command: [celery, -A, config.celery:app, worker, --loglevel=INFO, --concurrency=2]
    # This daemon has no HTTP listener; verify task readiness separately.
    healthcheck: {disable: true}
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_worker
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
    secrets: [django_secret_key, control_master_key, subscription_master_key, worker_db_password, cloud_credentials]
    networks: [data, queue, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    <<: *backend
    working_dir: /app/backend
    command: [celery, -A, config.celery:app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    healthcheck: {disable: true}
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_worker
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
    secrets: [django_secret_key, worker_db_password]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [data, queue]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  outbox-dispatcher:
    <<: *backend
    command: [xray-outbox]
    healthcheck: {disable: true}
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_outbox
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/outbox_db_password
    secrets: [django_secret_key, outbox_db_password]
    networks: [data, queue]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  security-ledger-dispatcher:
    <<: *backend
    command: [xray-security-outbox]
    healthcheck: {disable: true}
    environment:
      <<: *backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      XRAY_DATABASE_USER: xray_outbox
      XRAY_DATABASE_PASSWORD_FILE: /run/secrets/outbox_db_password
      XRAY_SECURITY_LEDGER_DIR: /var/lib/xray/security-ledger
    secrets: [django_secret_key, outbox_db_password]
    volumes:
      - ${XRAY_SECURITY_LEDGER_HOST_DIR}:/var/lib/xray/security-ledger
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  frontend:
    image: ${XRAY_FRONTEND_IMAGE:?set XRAY_FRONTEND_IMAGE to an immutable digest}
    restart: unless-stopped
    read_only: true
    user: "10001:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    networks: [control]

  gateway:
    image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      XRAY_ADMIN_HOST: ${XRAY_ADMIN_HOST}
      XRAY_ADMIN_ALLOW_CIDR: ${XRAY_ADMIN_ALLOW_CIDR}
      XRAY_SUBSCRIPTION_HOST: ${XRAY_SUBSCRIPTION_HOST}
    ports:
      - ${XRAY_ADMIN_BIND_IP:?set a private admin bind IP}:8443:8443
      - ${XRAY_SUBSCRIPTION_BIND_IP:-0.0.0.0}:443:9443
    secrets: [admin_tls_cert, admin_tls_key, subscription_tls_cert, subscription_tls_key]
    volumes:
      - ../nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/admin.conf:/etc/nginx/templates/admin.conf.template:ro
      - ../nginx/subscription.conf:/etc/nginx/templates/subscription.conf.template:ro
      - ../nginx/default-deny.conf:/etc/nginx/templates/default-deny.conf.template:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0750
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --output /dev/null --write-out '%{http_code}'
          --cacert /run/secrets/subscription_tls_cert --noproxy '*'
          --resolve ${XRAY_SUBSCRIPTION_HOST}:9443:127.0.0.1
          https://${XRAY_SUBSCRIPTION_HOST}:9443/health/live | grep -qx 200
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [edge, control, public-app]
    depends_on:
      admin-api: {condition: service_healthy}
      subscription-api: {condition: service_healthy}
      frontend: {condition: service_healthy}

networks:
  edge: {}
  egress: {}
  control: {internal: true}
  public-app: {internal: true}
  data: {internal: true}
  queue: {internal: true}

volumes:
  postgres-data: {}

secrets:
  django_secret_key: {file: "${XRAY_DJANGO_SECRET_KEY_FILE}"}
  subscription_django_secret_key: {file: "${XRAY_SUBSCRIPTION_DJANGO_SECRET_KEY_FILE}"}
  control_master_key: {file: "${XRAY_CONTROL_MASTER_KEY_FILE}"}
  subscription_master_key: {file: "${XRAY_SUBSCRIPTION_MASTER_KEY_FILE}"}
  owner_db_password: {file: "${XRAY_OWNER_DB_PASSWORD_FILE}"}
  admin_db_password: {file: "${XRAY_ADMIN_DB_PASSWORD_FILE}"}
  subscription_db_password: {file: "${XRAY_SUBSCRIPTION_DB_PASSWORD_FILE}"}
  worker_db_password: {file: "${XRAY_WORKER_DB_PASSWORD_FILE}"}
  outbox_db_password: {file: "${XRAY_OUTBOX_DB_PASSWORD_FILE}"}
  cloud_credentials: {file: "${XRAY_CLOUD_CREDENTIALS_FILE}"}
  admin_tls_cert: {file: "${XRAY_ADMIN_TLS_CERT_FILE}"}
  admin_tls_key: {file: "${XRAY_ADMIN_TLS_KEY_FILE}"}
  subscription_tls_cert: {file: "${XRAY_SUBSCRIPTION_TLS_CERT_FILE}"}
  subscription_tls_key: {file: "${XRAY_SUBSCRIPTION_TLS_KEY_FILE}"}
