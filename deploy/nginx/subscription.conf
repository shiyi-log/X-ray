limit_req_zone $binary_remote_addr zone=subscription_rate:10m rate=20r/m;

server {
    listen 9443 ssl;
    server_name ${XRAY_SUBSCRIPTION_HOST};
    ssl_certificate /run/secrets/subscription_tls_cert;
    ssl_certificate_key /run/secrets/subscription_tls_key;
    server_tokens off;
    # Nginx error messages include request URIs, which contain bearer tokens.
    error_log /dev/null;

    if ($host != "${XRAY_SUBSCRIPTION_HOST}") { return 404; }
    location ~ "^/s/[A-Za-z0-9_-]{43}$" {
        limit_req zone=subscription_rate burst=10 nodelay;
        limit_except GET HEAD { deny all; }
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://subscription-api:8000;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
    location = /health/live {
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://subscription-api:8000;
    }
    location / { return 404; }
}
