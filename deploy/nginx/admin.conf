server {
    listen 8443 ssl;
    server_name ${XRAY_ADMIN_HOST};
    ssl_certificate /run/secrets/admin_tls_cert;
    ssl_certificate_key /run/secrets/admin_tls_key;
    server_tokens off;
    client_max_body_size 1m;

    if ($host != "${XRAY_ADMIN_HOST}") { return 404; }
    allow ${XRAY_ADMIN_ALLOW_CIDR};
    deny all;

    location /api/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://admin-api:8000;
    }
    location /health/ {
        access_log off;
        proxy_pass http://admin-api:8000;
    }
    location / {
        proxy_set_header Host $host;
        proxy_pass http://frontend:8080;
    }
}
