mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
proxies:
  - name: fixture-ss
    type: ss
    server: 127.0.0.1
    port: 10001
    cipher: aes-128-gcm
    password: test-only-password
  - name: fixture-socks
    type: socks5
    server: 127.0.0.1
    port: 10002
    username: fixture
    password: fixture-pass
  - name: fixture-vmess
    type: vmess
    server: 127.0.0.1
    port: 10003
    uuid: 11111111-1111-4111-8111-111111111111
    alterId: 0
    cipher: auto
  - name: fixture-vless
    type: vless
    server: 127.0.0.1
    port: 10004
    uuid: 22222222-2222-4222-8222-222222222222
    network: tcp
    client-fingerprint: chrome
  - name: fixture-trojan
    type: trojan
    server: 127.0.0.1
    port: 10005
    password: test-only-password
    sni: proxy.example.test
    skip-cert-verify: false
proxy-groups:
  - name: X-ray
    type: select
    proxies:
      - fixture-ss
      - fixture-socks
      - fixture-vmess
      - fixture-vless
      - fixture-trojan
rules:
  - MATCH,X-ray
