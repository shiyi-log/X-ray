name: 发布 X-ray 版本

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的不可变版本标签
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xray-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, xray-trusted-2x4]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出受信任的 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验发布标签
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          version="$(git show "$RELEASE_TAG:VERSION")"
          test "$RELEASE_TAG" = "v${version}"
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"

      - name: 检出已验证的发布提交
        shell: bash
        run: git checkout --detach "$RELEASE_COMMIT"

      - name: 打包一键安装器
        shell: bash
        run: |
          set -euo pipefail
          XRAY_RELEASE_TAG="$RELEASE_TAG" ./scripts/package-installer-release.sh

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(<VERSION)
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT
          awk -v version="$version" '
            index($0, "## " version " - ") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >"$notes_file"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "X-ray ${version}" \
            --notes-file "$notes_file" \
            "dist/xray-installer-${version}.tar.gz" \
            "dist/xray-installer-${version}-manifest.json" \
            dist/SHA256SUMS
