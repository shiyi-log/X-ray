name: 3x-ui source baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Source checks only. Live PostgreSQL, panel/node processes, Xray binaries,
# production deployments and release publication are separate acceptance gates.
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      TZ: Asia/Shanghai
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check source baseline and whitespace
        run: |
          python3 scripts/check-baseline.py
          git diff --check
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, formatting and types
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Install Chromium for Storybook tests
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Frontend unit, component and Storybook tests
        working-directory: frontend
        run: npm test
      - name: Build the real embedded frontend
        working-directory: frontend
        run: npm run build
      - name: Verify locked Go dependencies
        run: |
          go mod download
          go mod verify
      - name: Use the pinned Go timezone database
        run: echo "ZONEINFO=$(go env GOROOT)/lib/time/zoneinfo.zip" >> "$GITHUB_ENV"
      - name: Go tests
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > "$RUNNER_TEMP/go-packages.txt"
          mapfile -t go_packages < "$RUNNER_TEMP/go-packages.txt"
          go test -shuffle=on -count=1 "${go_packages[@]}"
      - name: Go vet and build
        run: |
          mapfile -t go_packages < "$RUNNER_TEMP/go-packages.txt"
          go vet "${go_packages[@]}"
          go build "${go_packages[@]}"
          go build -trimpath -o build/x-ui .
      - name: Check generated schema consistency
        working-directory: frontend
        run: |
          npm run gen
          git diff --exit-code -- src/generated public/openapi.json
          cmp public/openapi.json ../docs/public/openapi.json
