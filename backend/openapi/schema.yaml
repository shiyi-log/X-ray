components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-xray_session
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        operation_id:
          type: string
          format: uuid
          nullable: true
        details:
          type: object
          additionalProperties: true
    AdminSession:
      type: object
      required:
      - authenticated
      - mfa_required
      - mfa_enabled
      properties:
        authenticated:
          type: boolean
        mfa_required:
          type: boolean
        mfa_enabled:
          type: boolean
        admin:
          type: object
          properties:
            username:
              type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        recent_auth_until:
          type: string
          format: date-time
          nullable: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    LoginChallenge:
      type: object
      required:
      - challenge_id
      - mfa_required
      - totp_setup_required
      properties:
        challenge_id:
          type: string
          format: uuid
        mfa_required:
          type: boolean
        totp_setup_required:
          type: boolean
        expires_at:
          type: string
          format: date-time
    LoginResponse:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/AdminSession'
        - properties:
            authenticated:
              enum:
              - true
      - $ref: '#/components/schemas/LoginChallenge'
    TotpSetupRequest:
      type: object
      description: An authenticated administrator with fresh step-up may omit challenge_id
        to begin optional enrollment. An existing password challenge may also be used.
      properties:
        challenge_id:
          type: string
          format: uuid
    TotpSetup:
      type: object
      required:
      - challenge_id
      - secret
      - otpauth_uri
      - expires_at
      properties:
        challenge_id:
          type: string
          format: uuid
        secret:
          type: string
        otpauth_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    TotpConfirmRequest:
      type: object
      required:
      - challenge_id
      - code
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          writeOnly: true
    TotpConfirmedSession:
      allOf:
      - $ref: '#/components/schemas/AdminSession'
      - type: object
        properties:
          recovery_codes:
            type: array
            items:
              type: string
    StepUpRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
          writeOnly: true
        code:
          type: string
          writeOnly: true
          description: Required when the administrator has enabled TOTP.
    StepUpResult:
      type: object
      required:
      - recent_auth_until
      properties:
        recent_auth_until:
          type: string
          format: date-time
    LocalLoginCapability:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    CloudAccount:
      type: object
      required:
      - id
      - name
      - provider
      - credential_version
      - enabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum:
          - aws_lightsail
          - aliyun_swas
        external_account_id:
          type: string
        credential_version:
          type: integer
        enabled:
          type: boolean
        validated_at:
          type: string
          format: date-time
          nullable: true
        last_validation_code:
          type: string
    CloudAccountPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        enabled:
          type: boolean
      minProperties: 1
    NodePool:
      type: object
      required:
      - id
      - name
      - region
      - regions
      - allocations
      - quota
      - used
      - available
      - allow_create
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
          enum:
          - ap-east-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-5
          - ca-central-1
          - eu-central-1
          - eu-north-1
          - eu-south-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - sa-east-1
          - us-east-1
          - us-east-2
          - us-west-2
        regions:
          type: array
          items:
            type: string
            enum:
            - ap-east-1
            - ap-northeast-1
            - ap-northeast-2
            - ap-south-1
            - ap-southeast-1
            - ap-southeast-2
            - ap-southeast-3
            - ap-southeast-5
            - ca-central-1
            - eu-central-1
            - eu-north-1
            - eu-south-2
            - eu-west-1
            - eu-west-2
            - eu-west-3
            - sa-east-1
            - us-east-1
            - us-east-2
            - us-west-2
        allocations:
          type: array
          items:
            type: object
            required:
            - region
            - quota
            - used
            - available
            properties:
              region:
                type: string
                enum:
                - ap-east-1
                - ap-northeast-1
                - ap-northeast-2
                - ap-south-1
                - ap-southeast-1
                - ap-southeast-2
                - ap-southeast-3
                - ap-southeast-5
                - ca-central-1
                - eu-central-1
                - eu-north-1
                - eu-south-2
                - eu-west-1
                - eu-west-2
                - eu-west-3
                - sa-east-1
                - us-east-1
                - us-east-2
                - us-west-2
              quota:
                type: integer
                minimum: 0
              used:
                type: integer
                minimum: 0
              available:
                type: integer
                minimum: 0
        quota:
          type: integer
        used:
          type: integer
        available:
          type: integer
        allow_create:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodePoolAllocationInput:
      type: object
      required:
      - region
      - quota
      additionalProperties: false
      properties:
        region:
          type: string
          enum:
          - ap-east-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-5
          - ca-central-1
          - eu-central-1
          - eu-north-1
          - eu-south-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - sa-east-1
          - us-east-1
          - us-east-2
          - us-west-2
        quota:
          type: integer
          minimum: 0
    NodePoolWriteRequest:
      type: object
      additionalProperties: false
      properties:
        allocations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NodePoolAllocationInput'
        region:
          type: string
          enum:
          - ap-east-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-5
          - ca-central-1
          - eu-central-1
          - eu-north-1
          - eu-south-2
