components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-xray_session
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        operation_id:
          type: string
          format: uuid
          nullable: true
        details:
          type: object
          additionalProperties: true
    AdminSession:
      type: object
      required:
      - authenticated
      - mfa_required
      properties:
        authenticated:
          type: boolean
        mfa_required:
          type: boolean
        admin:
          type: object
          properties:
            username:
              type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        recent_auth_until:
          type: string
          format: date-time
          nullable: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    LoginChallenge:
      type: object
      required:
      - challenge_id
      - mfa_required
      - totp_setup_required
      properties:
        challenge_id:
          type: string
          format: uuid
        mfa_required:
          type: boolean
        totp_setup_required:
          type: boolean
        expires_at:
          type: string
          format: date-time
    CloudAccount:
      type: object
      required:
      - id
      - name
      - provider
      - credential_version
      - enabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum:
          - aws_lightsail
          - aliyun_swas
        external_account_id:
          type: string
        credential_version:
          type: integer
        enabled:
          type: boolean
        validated_at:
          type: string
          format: date-time
          nullable: true
        last_validation_code:
          type: string
    NodePool:
      type: object
      required:
      - id
      - name
      - region
      - regions
      - allocations
      - quota
      - used
      - available
      - allow_create
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
          enum:
          - ap-southeast-1
          - ap-northeast-1
          - ap-east-1
          - us-east-1
          - us-west-2
        regions:
          type: array
          items:
            type: string
            enum:
            - ap-southeast-1
            - ap-northeast-1
            - ap-east-1
            - us-east-1
            - us-west-2
        allocations:
          type: array
          items:
            type: object
            required:
            - region
            - quota
            - used
            - available
            properties:
              region:
                type: string
                enum:
                - ap-southeast-1
                - ap-northeast-1
                - ap-east-1
                - us-east-1
                - us-west-2
              quota:
                type: integer
                minimum: 1
              used:
                type: integer
                minimum: 0
              available:
                type: integer
                minimum: 0
        quota:
          type: integer
        used:
          type: integer
        available:
          type: integer
        allow_create:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManagedNode:
      type: object
      required:
      - id
      - name
      - pool_id
      - provider
      - region
      - provisioning_state
      - health_state
      - security_state
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pool_id:
          type: string
          format: uuid
        pool_name:
          type: string
        cloud_account_id:
          type: string
          format: uuid
        cloud_account_name:
          type: string
        provider:
          type: string
        region:
          type: string
        plan_id:
          type: string
        image_id:
          type: string
        external_id:
          type: string
        addresses:
          type: array
          items:
            type: object
        raw_cloud_state:
          type: string
        desired_state:
          type: string
        provisioning_state:
          type: string
        health_state:
          type: string
        security_state:
          type: string
        consumes_quota:
          type: boolean
        desired_generation:
          type: integer
        applied_generation:
          type: integer
        observed_at:
          type: string
          format: date-time
          nullable: true
        observation_error:
          type: string
        last_error_code:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OperationStep:
      type: object
      required:
      - name
      - phase
      - status
      - attempt
      properties:
        id:
          type: integer
        name:
          type: string
        phase:
          type: string
        status:
          type: string
        attempt:
          type: integer
        external_request_id:
          type: string
        result:
          type: object
          additionalProperties: true
        evidence:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    Operation:
      type: object
      required:
      - id
      - kind
      - target_type
      - target_id
      - status
      - current_step
      - can_cancel
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        target_type:
          type: string
        target_id:
          type: string
          format: uuid
        status:
          type: string
        current_step:
          type: string
        can_cancel:
          type: boolean
        error_code:
          type: string
        error_details:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OperationStep'
        revocation_nodes:
          type: array
          items:
            type: object
        link_revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccessProfile:
      type: object
      required:
      - id
      - name
      - status
      - publishing_frozen
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        publishing_frozen:
          type: boolean
        credential_count:
          type: integer
        subscription_id:
          type: string
          format: uuid
          nullable: true
        subscription_status:
          type: string
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        plan_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        traffic_limit_bytes:
          type: integer
          nullable: true
        upload_bytes:
          type: integer
        download_bytes:
          type: integer
        usage_updated_at:
          type: string
          format: date-time
          nullable: true
        entitlement_state:
          type: string
        metering_coverage:
          type: string
        access_sync_pending:
          type: boolean
    Subscription:
      type: object
      required:
      - id
      - profile_id
      - profile_name
      - status
      - token_epoch
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        profile_name:
          type: string
        profile_status:
          type: string
        status:
          type: string
        token_epoch:
          type: integer
        current_revision:
          type: integer
          nullable: true
        public_version:
          type: string
          nullable: true
        revision_usable:
          type: boolean
        formats:
          type: array
          items:
            type: string
        unavailable_reasons:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        policy:
          $ref: '#/components/schemas/AccessProfile'
    AuditEvent:
      type: object
      required:
      - id
      - action
      - target_type
      - result
      - created_at
      properties:
        id:
          type: integer
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        result:
          type: string
        metadata:
          type: object
          additionalProperties: true
        actor:
          type: string
          nullable: true
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    Overview:
      type: object
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
        security_mode:
          type: string
        recent_operations:
          type: array
          items:
            type: object
        recent_audit:
          type: array
          items:
            type: object
    SystemInfo:
      type: object
      properties:
        version:
          type: string
        environment:
          type: string
        debug:
          type: boolean
        allowed_hosts:
          type: array
          items:
            type: string
        csrf_trusted_origins:
          type: array
          items:
            type: string
    ActionPreview:
      type: object
      required:
      - id
      - kind
      - target_id
      - required_phrase
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        target_id:
          type: string
          format: uuid
        snapshot:
          type: object
          additionalProperties: true
        required_phrase:
          type: string
        expires_at:
          type: string
          format: date-time
    SecretDelivery:
      type: object
      required:
      - subscription_id
      - token
      - urls
      - display_once
      properties:
        subscription_id:
          type: string
          format: uuid
        token:
          type: string
          writeOnly: true
        urls:
          type: object
          additionalProperties:
            type: string
        display_once:
          type: boolean
    GenericObject:
      type: object
      additionalProperties: true
    PaginatedCloudAccountList:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
