[project]
name = "xray-manager-backend"
version = "0.14.10"
description = "Private X-ray manager backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "celery>=5.5,<5.6",
  "gunicorn>=23,<24",
  "cryptography>=45,<46",
  "argon2-cffi>=25,<26",
  "pyotp>=2.9,<3",
  "paramiko>=4,<5",
  "PyYAML>=6,<7",
  "boto3>=1.43.95",
  "alibabacloud-swas-open20200601>=4.0.0",
  "alibabacloud-sts20150401>=1.2.0",
]

[dependency-groups]
test = ["pytest>=8.4,<9", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
django_find_project = false
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
